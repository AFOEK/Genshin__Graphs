[package]
name = "genshin_graphs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "genshin_graphs"
path = "main.rs"

[dependencies]
anyhow = "1.0.104"
parse-wiki-text-2 = "0.2.0"
quick-xml = "0.42.0"
reqwest = { version = "0.13.5", features = ["json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
